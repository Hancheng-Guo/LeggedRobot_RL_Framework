runtime:
  device: cuda
  dtype: float32
  num_threads: 4
  seed: null
  deterministic_ops: true

logging:
  file_name: training.log
  console: true


stage:
  - standing:
      max_iterations: 10
      transition:
        - {metric: "rollout/mean_len", method: mean, operator: ">=", threshold: 2.0, window: 1}

  - velocity_tracking:
      max_iterations: 10
      transition:
        - {metric: "rollout/mean_len", method: mean, operator: ">=", threshold: 2.0, window: 1}


component:
  runner:
    - type: on_policy
      config: rl_isaac_sim_unitree_go1

  algorithm:
    - type: ppo
      config: ppo_isaac_sim_unitree_go1_stage1

  policy:
    - type: actor_critic
      config: actor_critic_unitree_go1_velocity

  environment:
    - type: vector_env
      config: vector_env_isaac_sim_unitree_go1

  simulator:
    - type: isaac_sim
      config: isaac_sim_unitree_go1_velocity

  task:
    - type: locomotion
      config: locomotion_unitree_go1_standing
    - type: locomotion
      config: locomotion_unitree_go1_velocity
