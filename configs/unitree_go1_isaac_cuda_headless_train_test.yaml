runtime:
  device: cuda
  dtype: float32
  num_threads: 4
  seed: null
  deterministic_ops: false

logging:
  file_name: training.log
  console: true

stage:
  - standing:
      max_iterations: 2
      transition:
        - {metric: "rollout/mean_len", method: mean, operator: ">=", threshold: 0.0, window: 1}

component:
  runner:
    - type: on_policy
      config: isaac_rollout_64
  algorithm:
    - type: ppo
      config: ppo_num_batch_32
  policy:
    - type: actor_critic
      config: actor_critic_direct_actuation
  environment:
    - type: vector_env
      config: vector_env_128
  simulator:
    - type: isaac_sim
      config: isaac_sim_unitree_go1_headless
  task:
    - type: locomotion
      config: locomotion_unitree_go1_standing
