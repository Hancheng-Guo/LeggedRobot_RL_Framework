action_manager_config:
  terms:
    keyframe_centered_linear_map: {}
    tanh_map: {}
command_manager_config:
  terms:
    ang_vel_z:
      params:
        max_value: 0.0
        min_value: 0.0
      type: UniformOnReset
    lin_vel_x:
      params:
        max_value: 0.3
        min_value: 0.3
      type: UniformOnReset
    lin_vel_y:
      params:
        max_value: 0.0
        min_value: 0.0
      type: UniformOnReset
constants:
  action_lags: 4
  base_target_height: 0.2
  foot_lifted_height: 0.1
  integral_length: 300
curriculum_manager_config:
  terms: {}
event_manager_config: {}
observation_manager_config:
  clip: 3.0
  terms:
    base_angular_velocity:
      scale: 0.05
    base_height:
      scale: 2.0
    base_linear_velocity:
      scale: 0.5
    command:
      scale: 0.5
    foot_contact_state:
      scale: 1.0
    foot_duration_tanh:
      scale: 1.0
    foot_height:
      scale: 3.0
    joint_position:
      scale: 0.3
    joint_position_diff:
      scale: 0.5
    joint_velocity:
      scale: 0.05
    last_action:
      lags: 4
      scale: 0.1
    projected_gravity:
      scale: 1.0
    track_angular_velocity_z_error_integral_tanh:
      integral_length: 300
      scale: 1.0
    track_linear_velocity_x_error_integral_tanh:
      integral_length: 300
      scale: 1.0
    track_linear_velocity_y_error_integral_tanh:
      integral_length: 300
      scale: 1.0
randomization_manager_config:
  terms:
    terrain:
      difficulty_levels:
      - 0.25
      - 0.6
      - 1.0
      max_height: 0.04
      max_slope: 0.15
      patch_size:
      - 4
      - 4
      resolution: 0.1
      seed: 0
      spawn_margin: 0.5
      spawn_size:
      - 1.0
      - 1.0
      types:
      - plane
      - slope
      - rough
      weights:
      - 1
      - 1
      - 1
reward_manager_config:
  terms:
    action_diff_l2:
      params:
        max_lag: 4
      weight: -0.2
    base_angular_velocity_xy_l2:
      weight: -0.05
    base_height_l2:
      params:
        std: 0.2
        target_height: 0.2
      weight: -0.5
    base_linear_velocity_z_l2:
      weight: -1.0
    foot_contact_without_command:
      weight: 2.0
    foot_lift_height_diff_command_gated_l2:
      params:
        target_height: 0.1
      weight: -1.0
    foot_sliding_velocity_l2:
      weight: -1.0
    foot_state_duration_cubic_command_weighted_exp:
      params:
        sigma: 0.5
      weight: 0.2
    foot_state_switch:
      weight: -1.0
    illegal_contact_l1:
      weight: -2.0
    joint_limit_violation_l1:
      weight: -5.0
    joint_position_diff_l2:
      weight: -5.0
    joint_power_l1:
      weight: -0.0002
    joint_velocity_l2:
      weight: -0.02
    projected_gravity_xy_l2:
      weight: -2.0
    quadrupedal_foot_velocity_diff_l2:
      weight: -0.05
    track_angular_velocity_z_error_integral_l2:
      params:
        integral_length: 300
      weight: -1.0
    track_angular_velocity_z_l2_exp_and_logcosh:
      params:
        logcosh_weight: 0.1
        std: 2.5
      weight: 1.0
    track_linear_velocity_x_error_integral_l2:
      params:
        integral_length: 300
      weight: -2.0
    track_linear_velocity_x_l2_exp_and_logcosh:
      params:
        logcosh_weight: 0.1
      weight: 2.0
    track_linear_velocity_y_error_integral_l2:
      params:
        integral_length: 300
      weight: -2.0
    track_linear_velocity_y_l2_exp_and_logcosh:
      params:
        logcosh_weight: 0.1
      weight: 2.0
    trot_loop_duration_tanh:
      params:
        growth_rate: 5.0
      weight: 5.0
termination_manager_config:
  terms:
    base_height:
      min_height: 0.1
    body_contact:
      body_names:
      - trunk
