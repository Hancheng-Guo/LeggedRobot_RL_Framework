runtime:
  device: cuda
  dtype: float32
  num_threads: 4
  seed: None
  deterministic_ops: true


stage:
  - velocity_tracking:
      max_iterations: 3000
      transition:
        - {metric: "reward/track_linear_velocity_xy_l2_exp_and_logcosh", method: mean, operator: ">=", threshold: 9.0, window: 100}
        - {metric: "reward/track_angular_velocity_z_l2_exp_and_logcosh", method: mean, operator: ">=", threshold: 4.5, window: 100}


component:

  runner:
    - type: "on_policy"
      config: "rl_unitree_go1"

  algorithm:
    - type: "ppo"
      config: "ppo_unitree_go1_stage1"

  policy:
    - type: "actor_critic"
      config: "actor_critic_unitree_go1_stage1"

  environment:
    - type: "vector_env"
      config: "vector_env_1_unitree_go1"
      
  simulator:
    - type: "mujoco"
      config: "mujoco_unitree_go1_stage1"
      
  task:
    - type: "locomotion"
      config: "locomotion_unitree_go1_stage1"
