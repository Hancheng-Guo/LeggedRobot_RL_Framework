distribution:
  type: diagonal_gaussian
  initial_std: 0.5
  min_std: 0.1
  max_std: 1.0


actor:
  - type: linear
    in_features: obs_dim
    out_features: 512
  - type: elu
  - type: linear
    in_features: 512
    out_features: 256
  - type: elu
  - type: linear
    in_features: 256
    out_features: 128
  - type: elu
  - type: linear
    in_features: 128
    out_features: action_dim

critic:
  - type: linear
    in_features: obs_dim
    out_features: 256
  - type: elu
  - type: linear
    in_features: 256
    out_features: 128
  - type: elu
  - type: linear
    in_features: 128
    out_features: 64
  - type: elu
  - type: linear
    in_features: 64
    out_features: 1
